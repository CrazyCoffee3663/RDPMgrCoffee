[package]
name = "connmgr"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "connmgr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
zeroize = { version = "1.9.1", features = ["derive"] }
uuid = { version = "1.29.2", features = ["v4"] }
russh = "0.65.1"
russh-sftp = "2"
serialport = "4.10.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_Security", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_JobObjects", "Win32_System_SystemInformation"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
pbkdf2 = "0.12"
aes-gcm = "0.10"
md-5 = "0.10"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
hkdf = "0.12"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
rsa = { version = "0.9", features = ["sha1"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "form"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Argon2 в отладочной сборке без оптимизации считает ключ ~10 с
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
